name: Required Wasmtime execution

on:
  push:
    branches: [master]
  pull_request:

jobs:
  execution:
    runs-on: ubuntu-latest
    env:
      PSRS_REQUIRE_WASMTIME: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Read the locked standard-library revision
        id: stdlib-lock
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("stdlib.lock.json"))["revision"])')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout the locked standard library
        uses: actions/checkout@v4
        with:
          repository: biuld/psrs-stdlib
          ref: ${{ steps.stdlib-lock.outputs.revision }}
          path: psrs-stdlib-checkout
          ssh-key: ${{ secrets.PSRS_STDLIB_DEPLOY_KEY }}
      - name: Place the package where the lock expects it
        run: |
          dest="$GITHUB_WORKSPACE/../psrs-stdlib"
          rm -rf "$dest"
          mv "$GITHUB_WORKSPACE/psrs-stdlib-checkout" "$dest"
          test -f "$dest/manifest.json"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Wasmtime
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.2/wasmtime-v48.0.2-x86_64-linux.tar.xz \
            --output "$RUNNER_TEMP/wasmtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v48.0.2-x86_64-linux" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - run: cargo fmt --all --check
      - name: Check runtime measurement orchestration
        run: python3 -m unittest discover -s crates/psrs-driver/tests/suite -p test_runtime_runner.py -v
      - run: cargo test --workspace
