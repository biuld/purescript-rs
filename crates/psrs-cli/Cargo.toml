[package]
name = "psrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "psrs"
path = "src/main.rs"

[dependencies]
psrs-ast.workspace = true
psrs-driver.workspace = true
psrs-linker.workspace = true
psrs-hir.workspace = true
psrs-resolve.workspace = true
psrs-span.workspace = true
psrs-syntax.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
wat = "=1.245.1"
