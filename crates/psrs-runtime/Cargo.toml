[package]
name = "psrs-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["catalog", "formatter"]
# Immutable host-consumed catalog data: WIT sources, world identity, artifact
# bytes and provenance. Compiles no executable target code.
catalog = []
# The executable numeric exports. The Wasm artifact build enables only this
# feature; the default native build enables both.
formatter = ["dep:ryu-js", "dep:libm"]

[dependencies]
ryu-js = { version = "=1.0.2", default-features = false, optional = true }
libm = { version = "=0.2.15", optional = true }

[dev-dependencies]
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmprinter.workspace = true
wasmparser.workspace = true
