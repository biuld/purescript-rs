[package]
name = "psrs-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "psrs-runtime-package"
path = "tools/package.rs"
required-features = ["artifact-tool"]

[features]
default = ["catalog"]
# Immutable host-consumed catalog data: WIT sources, world identity, artifact
# bytes and provenance. Compiles no executable target code.
catalog = []
# The executable number module: formatting, parsing, and scalar math.
number = ["dep:ryu-js", "dep:libm"]
# The executable canonical realloc provider, built separately from number.
allocator = ["dep:dlmalloc"]
# Host-side encoding of the executable GC storage provider. Its target code
# uses Wasm GC directly, without a Rust heap or linear-memory handles.
gc-storage = ["dep:wasm-encoder"]
# Host-only build tool for reserving the numeric artifact's private stack.
artifact-tool = ["dep:wasm-encoder", "wasm-encoder/wasmparser", "dep:wasmparser"]

[dependencies]
ryu-js = { version = "=1.0.2", default-features = false, optional = true }
libm = { version = "=0.2.15", default-features = false, optional = true }
dlmalloc = { version = "=0.2.14", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasm-encoder = { workspace = true, optional = true }
wasmparser = { workspace = true, optional = true }

[dev-dependencies]
wasm-encoder = { workspace = true, features = ["wasmparser"] }
wasmprinter.workspace = true
wasmparser.workspace = true
